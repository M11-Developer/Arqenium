name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    # The Vercel git integration runs `npm install` in this workflow's repo; a
    # cancelled push must not leave a half-installed node_modules behind.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built API
        run: |
          ARQ_API_PORT=4455 ARQ_STATIC_DIR=dist/renderer node dist/server/main.js &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS -X POST http://127.0.0.1:4455/api/invoke \
              -H 'content-type: application/json' \
              -d '{"channel":"app.info","payload":{}}' > /tmp/info.json 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          echo "--- app.info"
          cat /tmp/info.json
          node -e "const r=require('/tmp/info.json');if(!r.ok)process.exit(1);console.log('version',r.result.version,'channels',r.result.channels.length)"
          echo "--- static index"
          curl -fsS -o /dev/null -w 'index.html %{http_code}\n' http://127.0.0.1:4455/
          echo "--- unvalidated body rejected"
          code=$(curl -s -o /tmp/err.json -w '%{http_code}' -X POST http://127.0.0.1:4455/api/invoke \
            -H 'content-type: application/json' -d '{"channel":"projects.get","payload":{}}')
          echo "status=$code body=$(cat /tmp/err.json)"
          [ "$code" = "400" ]
          kill $SERVER_PID

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
